meta:
  seed: 12345
  device: auto
  checkpoint_dir: checkpoints
data:
  type: nd-kf-mlp
  shared_factor_dist: normal
  k_shared: 3
  m_unique: 0
  d_out: 128
  mlp_depth: 2
  num_samples: 1048576
  batch_size: 4096
  num_workers: 0
  manifold_noise_a: 0.02
  manifold_noise_b: 0.02
  asymmetric_noise_magnitude: 0.1
  noise_bbox_expansion: 0.25
  asym_corrupt_rate_a: 0.0
  asym_corrupt_rate_b: 0.0
  external_noise_ratio: 0.1
model:
  stage_count: 12
  num_dims: 128
  hidden_units: 128
  predictor_type: affine
  coupling_type: affine
  coupling_clamp: 2.0
  affine_subnet_layers: 2
loss:
  type: ebm
  lambda_jac: 1.0
  congruence_mode: none
  congruence_tau: 0.5
  lambda_prior: 0.5
  lambda_sparse: 0.1
  prior_type: l2
  lambda_pred: 1.0
  pred_loss: l1
optim:
  epochs: 150
  lr: 0.001
logging:
  log_wandb: true
  save_every: 150
  tqdm_silent: false
  wandb_group: B16_capacity_scaling_fixed
