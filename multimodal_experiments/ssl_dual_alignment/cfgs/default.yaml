meta:
  seed: 12345
  device: auto
  checkpoint_dir: checkpoints

data:
  type: 2d
  num_samples: 4096
  batch_size: 128
  num_workers: 0

model:
  stage_count: 6
  num_dims: 2
  hidden_units: 128
  predictor_type: none

loss:
  type: supervised

optim:
  epochs: 500
  lr: 1.0e-3

logging:
  log_wandb: true
  save_every: 50
  tqdm_silent: false
