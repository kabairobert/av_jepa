# C03 — Affine predictor + Laplace prior (vs C01: diagonal→affine)
# Hypothesis: H3 (affine predictor fixes cloth distortion)
meta:
  seed: 12345
  device: auto
  checkpoint_dir: checkpoints

data:
  type: 3d-2f-common
  num_samples: 4096
  batch_size: 128
  num_workers: 0
  manifold_noise_a: 0.02
  manifold_noise_b: 0.02
  asymmetric_noise_magnitude: 0.1
  asymmetric_noise_rate_a: 0.025
  asymmetric_noise_rate_b: 0.025
  external_noise_ratio: 0.05

model:
  stage_count: 6
  num_dims: 3
  hidden_units: 128
  predictor_type: affine

loss:
  type: ebm
  lambda_jac: 1.0
  lambda_prior: 0.5
  lambda_sparse: 0.1
  prior_type: l1
  pred_loss: l1
  noise_reweighting: none
  reweighting_tau: 0.5

optim:
  epochs: 300
  lr: 1.0e-3

logging:
  log_wandb: true
  save_every: 50
  tqdm_silent: false
