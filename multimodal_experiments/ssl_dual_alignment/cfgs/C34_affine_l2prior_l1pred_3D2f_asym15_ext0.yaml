# C34 — Affine + L2 prior, l1 pred, 15%+15% asymmetric, 0% external, bbox+25%
# Hypothesis: L2 prior vs L1 prior under moderate asymmetric noise (pair with C31).
# Batch: B06 H5 — L1 vs L2 prior noise-dim suppression comparison.
meta:
  seed: 12345
  device: auto
  checkpoint_dir: checkpoints

data:
  type: 3d-2f-common
  num_samples: 4096
  batch_size: 128
  num_workers: 0
  manifold_noise_a: 0.02
  manifold_noise_b: 0.02
  asymmetric_noise_magnitude: 0.1
  asymmetric_noise_rate_a: 0.15
  asymmetric_noise_rate_b: 0.15
  external_noise_ratio: 0.00
  noise_bbox_expansion: 0.25

model:
  stage_count: 6
  num_dims: 3
  hidden_units: 128
  predictor_type: affine

loss:
  type: ebm
  lambda_jac: 1.0
  lambda_prior: 0.5
  lambda_sparse: 0.1
  prior_type: l2
  pred_loss: l1
  congruence_mode: none
  congruence_tau: 0.5

optim:
  epochs: 300
  lr: 1.0e-3

logging:
  log_wandb: true
  save_every: 50
  tqdm_silent: false
