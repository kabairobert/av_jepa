# Based on: multimodal_experiments/initial_trials/Pytorch-dual-disentangle_ebm_on_flow.ipynb
# Original 2D EBM config — diagonal predictor, L1 prior, sparse penalty
# Updated: use_l1 -> prior_type/pred_loss/noise_reweighting (new field names)
meta:
  seed: 12345
  device: auto
  checkpoint_dir: checkpoints

data:
  type: 2d
  num_samples: 4096
  batch_size: 128
  num_workers: 0
  manifold_noise_a: 0.02
  manifold_noise_b: 0.02
  asymmetric_noise_magnitude: 0.1
  asymmetric_noise_rate_a: 0.025
  asymmetric_noise_rate_b: 0.025
  external_noise_ratio: 0.05

model:
  stage_count: 6
  num_dims: 2
  hidden_units: 128
  predictor_type: diagonal

loss:
  type: ebm
  lambda_jac: 1.0
  lambda_prior: 0.5
  lambda_sparse: 0.1
  prior_type: l1
  pred_loss: l1
  noise_reweighting: none
  reweighting_tau: 0.5

optim:
  epochs: 150
  lr: 1.0e-3

logging:
  log_wandb: true
  save_every: 50
  tqdm_silent: false
