meta:
  seed: 12345
  device: auto
  checkpoint_dir: checkpoints
data:
  type: nd-kf-mlp
  num_samples: 4096
  batch_size: 128
  num_workers: 0
  asymmetric_noise_magnitude: 0.1
  noise_bbox_expansion: 0.25
  d_out: 10
  k_shared: 2
  m_unique: 8
  manifold_noise_a: 0.02
  manifold_noise_b: 0.02
  asymmetric_noise_rate_a: 0.0
  asymmetric_noise_rate_b: 0.0
  external_noise_ratio: 0.3
model:
  stage_count: 6
  num_dims: 10
  hidden_units: 256
  predictor_type: affine
loss:
  type: ebm
  lambda_jac: 1.0
  congruence_mode: none
  congruence_tau: 0.5
  lambda_prior: 0.5
  lambda_sparse: 0.1
  prior_type: l2
  lambda_pred: 1.0
  pred_loss: l2
optim:
  epochs: 150
  lr: 0.001
logging:
  log_wandb: true
  save_every: 150
  tqdm_silent: false
  wandb_group: B09_nd_kf_mlp
