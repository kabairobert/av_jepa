# C18 — MLP + L2 prior + L2 pred, high noise, TWO-stage
# B04 pair P4b
meta:
  seed: 12345
  device: auto
  checkpoint_dir: checkpoints

data:
  type: 3d-2f-common
  num_samples: 4096
  batch_size: 128
  num_workers: 0
  manifold_noise_a: 0.02
  manifold_noise_b: 0.02
  asymmetric_noise_magnitude: 0.1
  asymmetric_noise_rate_a: 0.10
  asymmetric_noise_rate_b: 0.10
  external_noise_ratio: 0.15

model:
  stage_count: 6
  num_dims: 3
  hidden_units: 128
  predictor_type: mlp

loss:
  type: ebm
  lambda_jac: 1.0
  lambda_prior: 0.5
  lambda_sparse: 0.1
  prior_type: l2
  pred_loss: l2
  congruence_mode: none

training:
  two_stage: true
  stage1_epochs: 150
  stage2_epochs: 150

optim:
  lr: 1.0e-3

logging:
  log_wandb: true
  save_every: 50
  tqdm_silent: false
