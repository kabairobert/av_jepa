hypotheses:

  # ------------------------------------------------------------------
  # H1 — The Non-Linear HD Bottleneck (Rotation vs MLP)
  # ------------------------------------------------------------------
  - id: H1
    claim: >-
      The flow model can effectively isolate the 2D shared manifold from high-dimensional 
      linearly rotated spaces, but struggles significantly more when the space is distorted 
      by a non-linear MLP.
    configs_compared:
      a: B10_M10_N1P11 # 10D MLP
      b: B10_R10_N1P11 # 10D Rot
    primary_metrics:
      [retrieval_cos@1]
    decision_rules:
      - metric: retrieval_cos@1
        condition: "{b} - {a} > {threshold}"
        threshold: 0.1
        verdict_true: MLP_DISTORTION_HARDER_THAN_ROTATION
        verdict_false: MLP_ROTATION_SIMILAR_DIFFICULTY

  # ------------------------------------------------------------------
  # H2 — Dimensionality Degradation (10D vs 20D)
  # ------------------------------------------------------------------
  - id: H2
    claim: >-
      Increasing the ambient space from 10D to 20D degrades retrieval accuracy 
      and increases leakage, especially under high external noise (30%).
    configs_compared:
      a: B10_M20_N2P11 # 20D MLP, 30% noise
      b: B10_M10_N2P11 # 10D MLP, 30% noise
    primary_metrics:
      [retrieval_cos@1]
    decision_rules:
      - metric: retrieval_cos@1
        condition: "{b} - {a} > {threshold}"
        threshold: 0.05
        verdict_true: HIGH_DIMS_DEGRADE_PERFORMANCE
        verdict_false: ROBUST_TO_DIMENSIONALITY

  # ------------------------------------------------------------------
  # H3 — Synergy is Strictly Required in HD
  # ------------------------------------------------------------------
  - id: H3
    claim: >-
      In 20D HD space, the predictor alone is insufficient. The L1 Prior + L1 Predictor 
      synergy is strictly required to isolate the 2D subspace and flatten the manifold.
    configs_compared:
      a: B10_M20_N1P01 # Predictor only
      b: B10_M20_N1P11 # L1 Prior + L1 Pred
    primary_metrics:
      [clean_flatness_ratio_a]
    decision_rules:
      - metric: clean_flatness_ratio_a
        condition: "{a} - {b} > {threshold}"  # Smaller flatness ratio is better
        threshold: 0.05
        verdict_true: SYNERGY_REQUIRED_IN_HD
        verdict_false: PREDICTOR_ALONE_SUFFICIENT_IN_HD

  # ------------------------------------------------------------------
  # H4 — L1 vs L2 Axis Alignment survives HD Distortion
  # ------------------------------------------------------------------
  - id: H4
    claim: >-
      Even when deeply buried in a 20D MLP-distorted space, the L1 Prior enforces 
      strict axis-alignment (diagonality) of the recovered 2D manifold, whereas L2 fails.
    configs_compared:
      a: B10_M20_N1P21 # L2 Prior
      b: B10_M20_N1P11 # L1 Prior
    primary_metrics:
      [diagonality_ratio]
    decision_rules:
      - metric: diagonality_ratio
        condition: "{b} - {a} > {threshold}"
        threshold: 0.08
        verdict_true: L1_PRIOR_ALIGN_AXES_IN_HD
        verdict_false: L1_L2_SIMILAR_AXIS_ALIGNMENT_IN_HD
