  A 72-config sweep testing representation flattening, subspace isolation, and strict axis alignment
  when the 3D-3F-2C manifold is embedded in high-dimensional (10D/20D) space, either linearly (orthogonal rotation) 
  or non-linearly (frozen MLP).

