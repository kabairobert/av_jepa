batch_id: B09_nd_kf_mlp
description: >-
  A 4x3x8 sweep using the nd-kf-mlp dataset mode across four ambient
  dimension/factor configs, three noise levels, and eight (prior, predictor)
  combinations. Tests whether dual-alignment methodology generalizes from
  analytical manifolds to high-dimensional random MLP embeddings.

