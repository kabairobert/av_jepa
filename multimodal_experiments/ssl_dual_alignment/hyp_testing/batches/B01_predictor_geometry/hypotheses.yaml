batch_id: B01_predictor_geometry
description: "Does predictor type and prior determine how well the model recovers shared latent geometry?"
configs:
  - C01_diag_l1prior_l1pred_3D2f
  - C02_diag_l2prior_l1pred_3D2f
  - C03_affine_l1prior_l1pred_3D2f
  - C04_affine_l2prior_l1pred_3D2f
  - C05_mlp_l2prior_l1pred_3D2f
  - C10_affine_l1prior_l2pred_3D2f

hypotheses:

  - id: H1
    claim: "Laplace prior (L1) produces sparser, more axis-aligned geometry than Gaussian (L2) with diagonal predictor"
    configs_compared:
      a: C01_diag_l1prior_l1pred_3D2f
      b: C02_diag_l2prior_l1pred_3D2f
    primary_metrics: [r2_joint, cca_rank]
    decision_rules:
      - metric: r2_joint
        condition: "{a} > {b} + {threshold}"
        threshold: 0.05
        verdict_true: SUPPORTED
        verdict_false: REFUTED
    check_plots:
      - "3D latent scatter z_A and z_B for C01 vs C02"
      - "Per-dim CCA correlation for C01 vs C02"

  - id: H2
    claim: "AffinePredictor fixes cloth distortion vs DiagonalPredictor under L1 prior"
    configs_compared:
      a: C01_diag_l1prior_l1pred_3D2f
      b: C03_affine_l1prior_l1pred_3D2f
    primary_metrics: [r2_joint, retrieval_l2@1, val_align_a2b]
    decision_rules:
      - metric: r2_joint
        condition: "{b} > {a} + {threshold}"
        threshold: 0.05
        verdict_true: SUPPORTED
        verdict_false: REFUTED
    check_plots:
      - "3D latent scatter z_A and z_B for C01 vs C03"
      - "val_align_a2b training curves for C01 vs C03"

  - id: H3
    claim: "Affine + L2 prior degrades geometry vs Affine + L1 prior"
    configs_compared:
      a: C03_affine_l1prior_l1pred_3D2f
      b: C04_affine_l2prior_l1pred_3D2f
    primary_metrics: [r2_joint, cca_rank]
    decision_rules:
      - metric: r2_joint
        condition: "{a} > {b} + {threshold}"
        threshold: 0.03
        verdict_true: SUPPORTED
        verdict_false: REFUTED
    check_plots:
      - "z_a_norm for C03 vs C04"

  - id: H4
    claim: "MLP predictor undoes axis alignment vs structured predictors"
    configs_compared:
      a: C03_affine_l1prior_l1pred_3D2f
      b: C05_mlp_l2prior_l1pred_3D2f
    primary_metrics: [cca_rank, retrieval_l2@1, r2_joint]
    decision_rules:
      - metric: cca_rank
        condition: "{a} > {b} + {threshold}"
        threshold: 0.5
        verdict_true: SUPPORTED
        verdict_false: REFUTED
    check_plots:
      - "CCA per-dim correlation for C03 vs C05"
      - "3D latent scatter for C05"

  - id: H5
    claim: "L1 vs L2 prediction loss has minor effect on geometry quality"
    configs_compared:
      a: C03_affine_l1prior_l1pred_3D2f
      b: C10_affine_l1prior_l2pred_3D2f
    primary_metrics: [r2_joint, val_loss]
    decision_rules:
      - metric: r2_joint
        condition: "abs({a} - {b}) < {threshold}"
        threshold: 0.05
        verdict_true: SUPPORTED
        verdict_false: REFUTED
    check_plots:
      - "val_loss curves for C03 vs C10"
