# metrics_registry.yaml
# Single source of truth: alias -> actual wandb summary key
# Use aliases in hypotheses.yaml decision_rules.
# When logging keys change in main.py, update here only.

metrics:
  # --- geometry / R2 (joint + per-modality) ---
  r2_joint:          "geom/zjoint/r2_mean"
  r2_a:              "geom/za/r2_mean"
  r2_b:              "geom/zb/r2_mean"
  r2_joint_u0:       "geom/zjoint/r2_u0"
  r2_joint_u1:       "geom/zjoint/r2_u1"
  r2_a_u0:           "geom/za/r2_u0"
  r2_a_u1:           "geom/za/r2_u1"
  r2_b_u0:           "geom/zb/r2_u0"
  r2_b_u1:           "geom/zb/r2_u1"

  # --- geometry / per-dim disentanglement (B04 H_disent) ---
  # dim0/dim1/dim2 of z_A regressed onto u1, u2, noise respectively
  r2_dim0_u1:        "geom/za/r2_dim0_u1"
  r2_dim1_u2:        "geom/za/r2_dim1_u2"
  r2_dim2_noise:     "geom/za/r2_dim2_noise"

  # --- geometry / manifold flatness (B06) ---
  # flatness_ratio: fraction of variance in top-2 PCA plane
  #   -> 1.0 = all variance in flat 2D plane (perfectly unrolled)
  #   -> low = variance spread into 3rd dim (curved manifold)
  # orth_residual: mean distance of each point from top-2 PCA plane
  #   -> 0.0 = all points lie in a flat plane
  #   -> high = manifold is curved / 3D
  # NOTE: computed over all points until point_type implemented;
  #       noise points underestimate true flatness (lower bound).
  flatness_ratio_a:  "geom/za/flatness_ratio"
  flatness_ratio_b:  "geom/zb/flatness_ratio"
  orth_residual_a:   "geom/za/orth_residual_mean"
  orth_residual_b:   "geom/zb/orth_residual_mean"

  # --- geometry / PCA axis-alignment (B04 H_geo) ---
  # max cosine similarity between top-2 PCA eigenvectors and nearest coord axis
  # 1.0 = perfectly axis-aligned, ~0.57 = random in 3D
  pca_axis_align_a:  "geom/pca_axis_align_a"
  pca_axis_align_b:  "geom/pca_axis_align_b"

  # --- geometry / CCA ---
  cca_rank:          "geom/cca_effective_rank"
  cca_dim0:          "geom/cca_corr_dim0"
  cca_dim1:          "geom/cca_corr_dim1"
  cca_dim2:          "geom/cca_corr_dim2"
  # diagonality score: sum(diag(CCA_corr_matrix)) / sum(CCA_corr_matrix)
  # 1.0 = dim-i of z_A maps exactly to dim-i of z_B, 0 = fully off-diagonal
  cca_diag_score:    "geom/cca_diag_score"

  # --- geometry / retrieval ---
  retrieval_cos@1:   "geom/retrieval_cos@1"
  retrieval_cos@5:   "geom/retrieval_cos@5"
  retrieval_l2@1:    "geom/retrieval_l2@1"
  retrieval_l2@5:    "geom/retrieval_l2@5"

  # --- geometry / norms ---
  z_a_norm:          "geom/z_a_norm_mean"
  z_b_norm:          "geom/z_b_norm_mean"

  # --- per-point-type alignment MSE (requires point_type in dataset) ---
  # logged once point_type_a/b implemented in dataset.__getitem__
  align_mse_a2b_manifold:       "val/align_mse_a2b_manifold"
  align_mse_b2a_manifold:       "val/align_mse_b2a_manifold"
  align_mse_a2b_asym_corrupt:   "val/align_mse_a2b_asym_corrupt"
  align_mse_b2a_asym_corrupt:   "val/align_mse_b2a_asym_corrupt"
  align_mse_a2b_external:       "val/align_mse_a2b_external"

  # --- train / val losses ---
  train_loss:        "train/loss"
  val_loss:          "val/loss"
  val_align_a2b:     "val/align_mse_a2b"
  val_align_b2a:     "val/align_mse_b2a"
  train_align_a2b:   "train/align_mse_a2b"
  train_align_b2a:   "train/align_mse_b2a"
