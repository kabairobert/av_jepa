# Video JEPA Training Configuration
# Train a self-supervised video prediction model on Moving MNIST

meta:
  seed: 2025
  device: auto  # auto, cuda, or cpu
  checkpoint_dir: checkpoints  # Directory to save checkpoints and logs
  # load_model: false             # Set true to resume training from a checkpoint
  # model_folder: null            # Absolute path to the run folder to resume from (e.g. checkpoints/video_jepa/dev_.../run_name_seed42)
  # load_checkpoint: latest.pth.tar  # Which checkpoint file to load (latest.pth.tar or epoch_N.pth.tar)

data:
  dataset: moving_mnist
  batch_size: 84
  num_workers: 16

model:
  # Encoder (ResNet5)
  dobs: 1           # Input channels (grayscale)
  henc: 32          # Hidden dimension in encoder
  dstc: 16          # Output representation dimension

  # Predictor (ResUNet)
  hpre: 32          # Hidden dimension in predictor

  # Training
  steps: 2          # Number of prediction steps during training

loss:
  type: bcs-euler-scalefree  # Regularizer type:
                   #   vcreg          -- variance-covariance regularization
                   #   bcs            -- BCS/SIGReg with original complex ECF
                   #   bcs-euler-scalefree -- BCS/SIGReg with real-valued Euler ECF (scale-free Euler ECF)
  # VCReg-specific (used when type: vcreg)
  # cov_coeff: 100.0  # Covariance loss weight
  # std_coeff: 10.0   # Standard deviation loss weight
  # BCS/SIGReg-specific (used when type: bcs*)
  num_slices: 32  # Number of random 1-D projections
  lmbd: 10        # BCS loss weight
  # Projector multipliers (multiplied with model.dstc)
  proj_hidden_mult: 4
  proj_out_mult: 4

optim:
  epochs: 50
  lr: 1.0e-3

logging:
  log_wandb: true
  wandb_group:        # Set to group runs (e.g., for seed averaging)
  log_every: 1        # Log every N epochs
  save_every: 10      # Save checkpoint every N epochs
  tqdm_silent: false  # Disable tqdm progress bars

training:
  use_amp: true       # Use automatic mixed precision
  dtype: bfloat16     # float16, bfloat16, or float32

# --- Parameters used when running with --full-sweep
# By default, only the parameters specified above are used
sweep:
  # Sweep grid for video JEPA hyperparameter search
  param_grid:
    data.batch_size: [32, 64]
    optim.lr: [0.001, 0.0001, 0.0005]
    loss.std_coeff: [1, 10, 100, 200]
    loss.cov_coeff: [1, 10, 100, 200]
    meta.seed: [1, 1000, 10000]
